<aside class="sidebar" [class.collapsed]="collapsed()">

  <!-- HEADER -->
  <div class="brand">

    <button class="collapse-btn" (click)="toggleSidebar()">
      <i class="fa-solid"
              [ngClass]="collapsed() ? 'fa-bars' : 'fa-layer-group'">
      </i>
    </button>

    <img src="assets/img/logo.png" class="logo">

  </div>

  <div class="divider"></div>

  <!-- NAV -->
  <nav class="nav">

    <button
      type="button"
      class="item"
      *ngFor="let item of navItems(); trackBy: trackByNavCode"
      [class.active]="isActive(item)"
      (click)="router.navigateByUrl(item.routePath)"
      [matTooltip]="collapsed() ? navLabel(item) : ''"
      [matTooltipDisabled]="!collapsed()"
      matTooltipPosition="after">

      <span class="icon mat-ico-wrap">
        <mat-icon class="nav-mat-icon" aria-hidden="true">{{ item.iconKey }}</mat-icon>
      </span>
      <span class="label" *ngIf="!collapsed()">
        {{ navLabel(item) }}
      </span>

    </button>

  </nav>

  <div class="sidebar-user" [class.collapsed-only]="collapsed()">
    <app-erp-user-avatar
      [primarySrc]="profile().avatarPrimarySrc"
      [initials]="profile().initials"
      size="sm"
      hostClass="sidebar-user__avatar"
    />
    <div class="sidebar-user__meta" *ngIf="!collapsed()">
      <span class="sidebar-user__name">{{ profile().displayName }}</span>
      <span class="sidebar-user__role-label">{{ 'profile.sidebarSignedIn' | t }}</span>
    </div>
  </div>

</aside>
