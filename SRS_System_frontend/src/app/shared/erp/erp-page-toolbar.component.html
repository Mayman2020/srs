<div [ngClass]="toolbarClasses()">
  <div class="erp-page-toolbar__text">
    <h2 class="erp-page-toolbar__title">{{ titleKey | t }}</h2>
    @if (subtitleKey) {
      <p class="erp-page-toolbar__subtitle">{{ subtitleKey | t }}</p>
    }
    <ng-content select="[erpToolbarMeta]"></ng-content>
  </div>
  <div class="erp-page-toolbar__actions">
    <ng-content select="[erpToolbarActions]"></ng-content>
  </div>
</div>
