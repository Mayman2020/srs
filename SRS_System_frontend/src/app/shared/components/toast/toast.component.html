<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (item of notification.items(); track item.id) {
    <article class="toast toast--{{ item.type }}" [@toastMotion]>
      <div class="toast__rail"></div>
      <div class="toast__content">
        <div class="toast__title">{{ ('notification.types.' + item.type) | t }}</div>
        <p class="toast__message">
          {{ item.messageKey ? (item.messageKey | t: item.params) : item.messageText }}
        </p>
      </div>
      <button
        type="button"
        class="toast__close"
        (click)="dismiss(item.id)"
        [attr.aria-label]="'common.close' | t">
        <span aria-hidden="true">x</span>
      </button>
    </article>
  }
</div>
