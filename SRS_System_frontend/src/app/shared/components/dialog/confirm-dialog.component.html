<app-dialog-shell
  [titleKey]="data.titleKey"
  icon="help_outline"
  (closeRequested)="cancel()">
  <p>{{ data.messageKey | t: data.params }}</p>

  <div dialogActions>
    <button mat-stroked-button type="button" class="dialog-cancel-btn" (click)="cancel()">
      {{ (data.cancelButton?.labelKey ?? 'common.close') | t }}
    </button>
    <button
      mat-flat-button
      class="dialog-confirm-btn"
      type="button"
      (click)="confirm()">
      {{ (data.confirmButton?.labelKey ?? 'common.confirm') | t }}
    </button>
  </div>
</app-dialog-shell>
