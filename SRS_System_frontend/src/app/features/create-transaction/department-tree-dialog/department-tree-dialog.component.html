<h2 mat-dialog-title class="dialog-title">اختيار الجهات</h2>

<mat-dialog-content class="dialog-content">

  <!-- SELECT ALL ROW -->
    <div class="select-all-row">
      <div class="select-all-pill">
        <span class="select-all-label">اختيار الكل</span>
        <mat-checkbox
          [checked]="isAllSelected()"
          [indeterminate]="isSomeSelected()"
          (change)="toggleAll($event.checked)">
        </mat-checkbox>
      </div>
    </div>

  <!-- TREE -->
  <div class="tree-wrapper">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="entity-tree">

      <!-- PARENT NODE -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
        <div class="parent-group" [class.expanded]="treeControl.isExpanded(node)">
    
          <div class="parent-row tree-row">

            <span class="node-dot parent-dot"></span>

            <span class="node-label parent-label">
              {{ node.name }}
            </span>

             <mat-checkbox class="row-checkbox"
              [checked]="isSelected(node.name)"
              [indeterminate]="isIndeterminate(node)"
              (change)="toggleNode(node, $event.checked)">
            </mat-checkbox>

            <button matTreeNodeToggle class="toggle-btn">
              <mat-icon class="toggle-icon"
                [class.open]="treeControl.isExpanded(node)">
                chevron_left
              </mat-icon>
            </button>

          </div>

          <div class="children-container" *ngIf="treeControl.isExpanded(node)">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </div>
      </mat-nested-tree-node>

      <!-- LEAF NODE -->
      <mat-tree-node *matTreeNodeDef="let node">
        <div class="child-row">
          <span class="node-dot child-dot"></span>
          <span class="node-label child-label">{{ node.name }}</span>
          <mat-checkbox class="row-checkbox"
            [checked]="isSelected(node.name)"
            (change)="toggleLeaf(node.name, $event.checked)">
          </mat-checkbox>
        </div>
      </mat-tree-node>

    </mat-tree>
  </div>

</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-flat-button class="btn-primary" (click)="confirm()">
   تأكيد
  </button>
  <button mat-button mat-dialog-close class="btn-outline">إلغاء</button>
</mat-dialog-actions>
