<app-erp-dialog [titleKey]="'departmentTree.title'" icon="account_tree" [wide]="true">
  <div class="dialog-content">

    <p class="muted" *ngIf="loadError">{{ 'errors.generic' | t }}</p>

    <div class="select-all-row" *ngIf="!loadError && dataSource.data.length">
      <div class="select-all-pill">
        <span class="select-all-label">{{ 'departmentTree.selectAll' | t }}</span>
        <mat-checkbox
          [checked]="isAllSelected()"
          [indeterminate]="isSomeSelected()"
          (change)="toggleAll($event.checked)">
        </mat-checkbox>
      </div>
    </div>

    <div class="tree-wrapper" *ngIf="!loadError">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="entity-tree">

        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="parent-group" [class.expanded]="treeControl.isExpanded(node)">

            <div class="parent-row tree-row">

              <span class="node-dot parent-dot"></span>

              <span class="node-label parent-label">
                {{ node.label }}
              </span>

              <mat-checkbox class="row-checkbox"
                [checked]="isSelected(node.id)"
                [indeterminate]="isIndeterminate(node)"
                (change)="toggleNode(node, $event.checked)">
              </mat-checkbox>

              <button matTreeNodeToggle class="toggle-btn">
                <mat-icon class="toggle-icon"
                  [class.open]="treeControl.isExpanded(node)">
                  chevron_left
                </mat-icon>
              </button>

            </div>

            <div class="children-container" *ngIf="treeControl.isExpanded(node)">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </div>
        </mat-nested-tree-node>

        <mat-tree-node *matTreeNodeDef="let node">
          <div class="child-row">
            <span class="node-dot child-dot"></span>
            <span class="node-label child-label">{{ node.label }}</span>
            <mat-checkbox class="row-checkbox"
              [checked]="isSelected(node.id)"
              (change)="toggleLeaf(node.id, $event.checked)">
            </mat-checkbox>
          </div>
        </mat-tree-node>

      </mat-tree>
    </div>

  </div>

  <div erpDialogActions>
    <button mat-button type="button" class="dialog-cancel-btn" mat-dialog-close>
      {{ 'departmentTree.cancel' | t }}
    </button>
    <button mat-flat-button type="button" class="dialog-confirm-btn" (click)="confirm()">
      {{ 'departmentTree.confirm' | t }}
    </button>
  </div>
</app-erp-dialog>
