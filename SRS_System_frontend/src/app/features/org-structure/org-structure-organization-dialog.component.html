<app-erp-dialog [titleKey]="titleKey" icon="business">
  <form [formGroup]="form" class="org-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'orgCrud.code' | t }}</mat-label>
      <input matInput formControlName="code" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'orgCrud.nameAr' | t }}</mat-label>
      <input matInput formControlName="nameAr" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'orgCrud.nameEn' | t }}</mat-label>
      <input matInput formControlName="nameEn" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'orgCrud.parent' | t }}</mat-label>
      <mat-select formControlName="parentId">
        <mat-option [value]="null">{{ 'common.dash' | t }}</mat-option>
        <mat-option *ngFor="let p of availableParents" [value]="p.id">
          {{ parentLabel(p) }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <label class="inline-check">
      <input type="checkbox" formControlName="external" />
      <span>{{ 'orgCrud.external' | t }}</span>
    </label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'orgCrud.description' | t }}</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>
  </form>
  <div erpDialogActions>
    <button mat-button type="button" (click)="cancel()">{{ 'common.cancel' | t }}</button>
    <button mat-flat-button type="button" color="primary" (click)="save()">{{ 'common.save' | t }}</button>
  </div>
</app-erp-dialog>
