<div class="vt-wrap" dir="rtl" *ngIf="data as chartData">
  <ngx-interactive-org-chart
    class="vt-chart"
    [data]="chartData"
    layout="vertical"
    [isRtl]="true"
    [collapsible]="true"
    [displayChildrenCount]="false"
    [themeOptions]="themeOptions"
    [minZoom]="0.45"
    [maxZoom]="2.5"
    [highlightZoomNodeWidthRatio]="0.32"
    [highlightZoomNodeHeightRatio]="0.22"
    [highlightZoomMinimum]="0.9"
  >
    <ng-template #nodeTemplate let-node="node">
      <section
        [style.--d]="(node?.data?.delayMs ?? 0) + 'ms'"
        [class]="'vt-card ' + cardStatusClass(node?.data?.status)"
      >
        <header class="vt-card__head">
          <div class="vt-card__title-wrap">
            <div class="vt-card__title">{{ node?.data?.title ?? node?.name }}</div>
            <span class="vt-card__status" *ngIf="node?.data?.status">{{
              statusLookupLabel(node.data.status)
            }}</span>
          </div>

          <div class="vt-card__tools">
            <button type="button" class="vt-icbtn" [attr.title]="'visualTracking.searchTooltip' | t">
              <span class="vt-ic">🔍</span>
            </button>
          </div>
        </header>

        <div class="vt-card__note" *ngIf="node?.data?.note">
          {{ node.data.note }}
        </div>

        <footer class="vt-card__foot">
          <div class="vt-card__user">{{ node?.data?.user }}</div>

          <!-- LTR inside RTL layout -->
          <div
            class="vt-card__date"
            *ngIf="node?.data?.date"
            dir="ltr"
            style="unicode-bidi:isolate"
          >
            {{ (node.data.date | date:'d MMM y - hh:mm a') | latinDigits }}
          </div>
        </footer>
      </section>
    </ng-template>
  </ngx-interactive-org-chart>
</div>
