spring:
  application:
    name: admin-communications-api
  profiles:
    # When SPRING_PROFILES_ACTIVE is unset, use local developer defaults (application-local.yml).
    default: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    # Single schema for the whole app: Flyway + JPA entities + Camunda engine tables all use srs_system only.
    # Never point tools (DBeaver, psql) at the same DB without the same search_path — otherwise you see missing/wrong tables.
    # currentSchema=srs_system on the JDBC URL + Hikari init below keep unqualified DDL/DML in srs_system (Camunda ACT_* included).
    # Optional overrides: DB_URL, DB_USER (then SPRING_DATASOURCE_*). If you set DB_URL / SPRING_DATASOURCE_URL yourself, keep ?currentSchema=srs_system.
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=srs_system}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    # Password: profile `local` sets it in application-local.yml. Other profiles / Docker: set SPRING_DATASOURCE_PASSWORD.
    # Do not use ${SPRING_DATASOURCE_PASSWORD:} here — an empty env var would override the local profile and break auth.
    driver-class-name: org.postgresql.Driver
    hikari:
      # Belt-and-suspenders: some clients strip URL options; this guarantees srs_system is first on the search_path every checkout.
      connection-init-sql: SET search_path TO srs_system, public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: srs_system
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Run on every Flyway-managed connection before migrations. Hikari connection-init-sql alone is
    # not always applied to the same JDBC session Flyway uses; without this, unqualified DDL in V1/V2
    # can land in public while verification expects srs_system.
    init-sqls:
      - SET search_path TO srs_system, public
    baseline-on-migrate: true
    repair-on-migrate: true
    # Single baseline DDL (see V1__srs_system_full_baseline.sql); history table lives in srs_system.
    # Stale history (e.g. DB version 2 but only V1 on classpath) skips V1 and breaks the app — run
    # docs/db/srs_system_full_clean_reset.sql (drops srs_system + public.flyway_schema_history if present).
    schemas: srs_system
    default-schema: srs_system
    create-schemas: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

camunda.bpm:
  admin-user:
    id: ${CAMUNDA_BPM_ADMIN_USER:admin}
    password: ${CAMUNDA_BPM_ADMIN_PASSWORD:}
  # Same DB as the app; engine tables in srs_system. Prefix must be schema + '.' (Camunda validation).
  database:
    type: postgres
    # DDL is applied by Flyway V2__camunda_schema.sql — engine must not mutate schema at runtime.
    schema-update: false
    schema-name: srs_system
    table-prefix: srs_system.
  webapp:
    enabled: false
  job-execution:
    enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # health + readiness/liveness probes + prometheus scrape endpoint for workflow SLA metrics.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

ac:
  security:
    cors:
      # Comma-separated Ant-style origin patterns. Prod profile requires AC_CORS_ALLOWED_ORIGIN_PATTERNS (no localhost).
      allowed-origin-patterns: ${AC_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    headers:
      # HSTS should be true only when the app is served over HTTPS (or behind TLS-terminating proxy that sets X-Forwarded-Proto).
      hsts-enabled: ${AC_SECURITY_HSTS_ENABLED:false}
    jwt:
      # HS256 — minimum 32 UTF-8 bytes. Local profile sets a dev secret in application-local.yml; prod uses AC_JWT_SECRET.
      secret: ${AC_JWT_SECRET:}
  auth:
    refresh-ttl-seconds: ${AUTH_REFRESH_TTL_SECONDS:604800}
    mfa-otp-ttl-seconds: ${MFA_OTP_TTL_SECONDS:300}
    password-reset-ttl-seconds: ${AUTH_PASSWORD_RESET_TTL_SECONDS:3600}
    password-reset-frontend-base-url: ${AUTH_PASSWORD_RESET_FRONTEND_URL:http://localhost:4200}
    lockout:
      max-failed-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      lock-minutes: ${AUTH_LOCKOUT_MINUTES:15}
  workflow:
    escalation:
      unassigned-after-minutes: ${WF_ESCALATION_MINUTES:120}
      poll-ms: ${WF_ESCALATION_POLL_MS:120000}
  acting-assignment:
    expiry-poll-ms: ${ACTING_ASSIGNMENT_EXPIRY_MS:600000}
    reconciliation-poll-ms: ${ACTING_ASSIGNMENT_RECONCILIATION_MS:180000}
    reconciliation-max-tasks: ${ACTING_ASSIGNMENT_RECONCILE_LIMIT:150}
  storage:
    root: ${AC_STORAGE_ROOT:./data/attachments}
  attachment:
    encryption:
      # Master switch. When false, uploads land as plaintext (legacy mode) — useful for local dev
      # only. Production must keep this true.
      enabled: ${AC_ATTACHMENT_ENCRYPTION_ENABLED:true}
      # Reference persisted on every encrypted version row. Rotate by issuing a new ref + KEK and
      # leaving the old one available to decrypt existing rows.
      kek-ref: ${AC_ATTACHMENT_KEK_REF:KEK_V1}
      # 64 hex chars = 32-byte AES-256 KEK. Empty value falls back to a deterministic dev key and
      # logs WARN at startup. Production MUST set AC_ATTACHMENT_KEK_HEX (runbook §11).
      kek-hex: ${AC_ATTACHMENT_KEK_HEX:}
    download-token:
      # Short by design — clients call /download-intent right before /download/{token}.
      ttl-seconds: ${AC_ATTACHMENT_DOWNLOAD_TOKEN_TTL_S:60}
      # Cleanup job purges tokens past expires_at + 1h.
      cleanup-poll-ms: ${AC_ATTACHMENT_DOWNLOAD_TOKEN_CLEANUP_MS:600000}
    verify:
      public:
        rate-limit-per-minute: 30
        default-ttl-days: 1825
  signature:
    # ED25519 is fixed at the SPI level; configuration is here for the env-loaded keypair only.
    algorithm: ${AC_SIGN_ALGORITHM:ED25519}
    key-ref: ${AC_SIGN_KEY_REF:SIGN_V1}
    private-key-pem: ${AC_SIGN_PRIVATE_KEY_PEM:}
    public-key-pem:  ${AC_SIGN_PUBLIC_KEY_PEM:}
  retention:
    poll-ms: 3600000
    batch-size: 500
    dry-run: ${AC_RETENTION_DRY_RUN:true}
  notification:
    routing: ${AC_NOTIFICATION_ROUTING:outbox}
    dispatch:
      poll-ms: 5000
      batch-size: 50
      max-attempts: 8
      base-backoff-ms: 5000
      max-backoff-ms: 3600000
    webhook:
      signing-secret: ${AC_NOTIFICATION_WEBHOOK_SECRET:}
    teams:
      default-target-code: ${AC_NOTIFICATION_TEAMS_TARGET:}
    sms:
      gateway-url: ${AC_SMS_GATEWAY_URL:}
      api-key-header: ${AC_SMS_API_KEY_HEADER:X-Api-Key}
      api-key: ${AC_SMS_API_KEY:}

logging:
  level:
    org.hibernate.SQL: WARN
    com.gov.ac.correspondence: INFO
    org.camunda: WARN
