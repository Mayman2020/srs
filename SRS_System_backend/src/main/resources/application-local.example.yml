# -----------------------------------------------------------------------------
# Optional: backup template — committed defaults live in application-local.yml.
# If you remove application-local.yml, run-backend.ps1 recreates it from this file.
# -----------------------------------------------------------------------------

spring:
  datasource:
    password: postgres

camunda.bpm:
  admin-user:
    password: admin

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ac:
  security:
    cors:
      allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
    headers:
      hsts-enabled: false
    jwt:
      secret: "0123456789abcdef0123456789abcdef0123456789abcdef01"
