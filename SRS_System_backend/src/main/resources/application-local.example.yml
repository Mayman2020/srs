# -----------------------------------------------------------------------------
# Optional: backup template — committed defaults live in application-local.yml.
# If you remove application-local.yml, run-backend.ps1 recreates it from this file.
#
# PostgreSQL must accept the credentials below. Default matches hesabaty-backend: DB_PASSWORD with default "admin".
# Override: AC_LOCAL_DB_PASSWORD (SRS) or DB_PASSWORD (shared). See run-backend.secrets.EXAMPLE.ps1.
# Avoid SPRING_DATASOURCE_PASSWORD on Windows for local — it overrides YAML; run-backend.ps1 clears it for profile local.
# -----------------------------------------------------------------------------

spring:
  datasource:
    password: ${AC_LOCAL_DB_PASSWORD:${DB_PASSWORD:admin}}

camunda.bpm:
  admin-user:
    password: admin

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ac:
  security:
    cors:
      allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
    headers:
      hsts-enabled: false
    jwt:
      secret: "0123456789abcdef0123456789abcdef0123456789abcdef01"
