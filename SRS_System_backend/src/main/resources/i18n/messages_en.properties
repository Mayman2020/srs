# Default English messages for backend exceptions and validation messages.
# Mirrored in messages_ar.properties.

# generic
error.generic                       = An unexpected error occurred. Please try again.
error.notFound                      = Requested resource was not found.
error.badRequest                    = The request could not be understood.
error.forbidden                     = You do not have permission to perform this action.
error.gone                          = This resource is no longer available.
error.unauthorized                  = Authentication is required.
error.conflict                      = The request could not be completed due to a data conflict.
error.validation                    = Validation failed for one or more fields.
error.systemConfig                  = Server configuration error. Contact the administrator.
error.workflowEngine                = Workflow engine could not complete the operation. Please try again later.
error.attachmentTransfer            = Could not transfer attachment content. Please try again later.

# correspondence
correspondence.access.denied        = You do not have access to this correspondence.
correspondence.clearance.required   = Your security clearance is insufficient for this correspondence.
correspondence.notFound             = Correspondence was not found.
correspondence.cancel.blocked       = This correspondence cannot be cancelled in its current status.

# workflow
workflow.task.notAssigned           = This task is not assigned to you.
workflow.action.requiresComment     = A comment is required for this action.
workflow.action.unknown             = Unknown workflow action.
workflow.action.notAllowed          = This action is not allowed for the current correspondence status.

# routing
routing.sameUnit                    = Direct route within the same sub-unit.
routing.viaParent                   = Routed through the parent unit.
routing.viaHeadquarters             = Routed through headquarters.
routing.target.notFound             = Target department was not found.

# notification
notification.dispatch.forbidden     = You are not authorized to dispatch notifications.

# circular
circular.access.denied              = You are not a recipient of this circular.

# auth
auth.invalidCredentials             = Invalid username or password.
auth.mfa.required                   = Multi-factor authentication is required.
auth.mfa.invalid                    = The verification code is invalid or expired.
