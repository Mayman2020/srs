# Arabic messages — matches messages_en.properties keys.

# generic
error.generic                       = حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.
error.notFound                      = العنصر المطلوب غير موجود.
error.badRequest                    = تعذر فهم الطلب.
error.forbidden                     = ليست لديك صلاحية للقيام بهذا الإجراء.
error.gone                          = لم يعد هذا المورد متاحاً.
error.unauthorized                  = يلزم تسجيل الدخول.
error.conflict                      = تعذر تنفيذ الطلب بسبب تعارض في البيانات.
error.validation                    = فشل التحقق من صحة الحقول.
error.systemConfig                  = خطأ في إعدادات الخادم. يرجى التواصل مع المسؤول.
error.workflowEngine                = تعذر على محرك سير العمل إكمال العملية. حاول لاحقاً.
error.attachmentTransfer            = تعذر نقل محتوى المرفق. حاول لاحقاً.

# correspondence
correspondence.access.denied        = ليس لديك صلاحية الاطلاع على هذه المراسلة.
correspondence.clearance.required   = درجة تصريفك الأمني لا تسمح بالاطلاع على هذه المراسلة.
correspondence.notFound             = المراسلة غير موجودة.
correspondence.cancel.blocked       = لا يمكن إلغاء هذه المراسلة في حالتها الحالية.

# workflow
workflow.task.notAssigned           = هذه المهمة غير مسندة إليك.
workflow.action.requiresComment     = يلزم إضافة تعليق لهذا الإجراء.
workflow.action.unknown             = إجراء سير عمل غير معروف.
workflow.action.notAllowed          = الإجراء غير مسموح به للحالة الحالية للمراسلة.

# routing
routing.sameUnit                    = توجيه مباشر داخل نفس الوحدة الفرعية.
routing.viaParent                   = توجيه عبر الوحدة الأم.
routing.viaHeadquarters             = توجيه عبر القيادة العامة.
routing.target.notFound             = الإدارة المستهدفة غير موجودة.

# notification
notification.dispatch.forbidden     = ليست لديك صلاحية إرسال الإشعارات.

# circular
circular.access.denied              = أنت لست مستلماً لهذا التعميم.

# auth
auth.invalidCredentials             = اسم المستخدم أو كلمة المرور غير صحيحة.
auth.mfa.required                   = يلزم التحقق الثنائي.
auth.mfa.invalid                    = رمز التحقق غير صالح أو منتهي الصلاحية.
