# Minimal Spring profile for slice tests that need a real Postgres via Testcontainers.
# The actual datasource URL / username / password are injected by @DynamicPropertySource at runtime;
# everything else here is the smallest config required to make Flyway + JPA happy without booting
# the full app (Camunda, security, web layer are intentionally not configured here).
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO srs_system, public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: srs_system
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    init-sqls:
      - SET search_path TO srs_system, public
    baseline-on-migrate: true
    schemas: srs_system
    default-schema: srs_system
    create-schemas: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
